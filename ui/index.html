<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HautFit Mirror</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hautfit.css">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  
<body>
  <div class="watercolor-bg"></div>

  <div id="welcomeScreen">
    <img src="images/Seal_of_Holy_Angel_University.png" alt="Logo" id="logo">
    <div id="introText" style="display: none;">
      <h1>Welcome to HautFit</h1>
      <p>Your personalized smart mirror experience</p>
      <button id="get-started-btn">Get Started</button>
    </div>
  </div>

  <div id="eventOptionsScreen" style="display: none;">
    <h2>Select an Event</h2>
    <div class="options-container">
        <button class="event-option" data-event="casual">Casual</button>
        <button class="event-option" data-event="formal">Formal</button>
        <button class="event-option" data-event="streetwear">Streetwear</button>
    </div>
  </div>

  <div id="genderScreen" style="display: none; text-align: center;">
    <h2>Select Gender</h2>
    <div class="options-container">
        <button class="gender-option" data-gender="male">Male</button>
        <button class="gender-option" data-gender="female">Female</button>
    </div>
  </div>

  <div id="hautfit" class="module" style="display: none; opacity: 0; transition: opacity 1s ease-in-out; width: 100vw; height: 100vh; overflow: hidden;">
    
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; gap: 20px;">
      
      <div style="display: flex; justify-content: center; align-items: center; margin-top: 2vh;">
        <div class="camera-container" style="position: relative; width: 640px; height: 480px; border-radius: 15px; overflow: hidden; border: 4px solid white; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
          <video id="cameraVideo" autoplay playsinline muted style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
          <canvas id="poseCanvas" width="640" height="480" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1);"></canvas>
        </div>
      </div>

      <div id="uiPanel" style="flex: 1; width: 100%; max-width: 640px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; overflow: hidden; padding-bottom: 20px;">
        
        <div id="cameraIntroContainer" style="background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 0 15px rgba(0,0,0,0.5); width: 100%;">
          <h1 style="color: #4ade80; margin-bottom: 15px; font-size: 2.2em;">Ready?</h1>
          <div id="cameraIntroText" style="color: white; font-size: 1.2rem; line-height: 1.5; margin-bottom: 25px;">
            You are about to experience our <b>HautFit Smart Mirror</b>.<br>
            Are you ready to know what fits for you?
          </div>
          <button id="cameraYesBtn" style="padding: 12px 35px; font-size: 1.2rem; background: #facc15; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; color: black; transition: transform 0.2s;">
              YES, START SCANNING
          </button>
        </div>

        <div id="tryOnModeContainer" style="display: none; background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 0 15px rgba(0,0,0,0.5); width: 100%;">
            <h2 style="color: #4ade80; margin-bottom: 20px;">Choose Your Try-On Experience</h2>
            
            <div style="display: flex; gap: 15px; justify-content: center; flex-direction: column;">
                
                <button id="btnImageTryOn" style="padding: 20px; border: 2px solid #4ade80; border-radius: 15px; background: rgba(255,255,255,0.1); color: white; cursor: pointer; transition: transform 0.2s; text-align: center;">
                    <div style="font-size: 40px; margin-bottom: 10px;">📸</div>
                    <p style="font-size: 14px; line-height: 1.4; margin: 0;">Create your look with your chosen shirt using our<br><b style="color:#4ade80; font-size: 16px;">Image Try-On!</b></p>
                </button>

                <button id="btnVirtualTryOn" style="padding: 20px; border: 2px solid #facc15; border-radius: 15px; background: rgba(255,255,255,0.1); color: white; cursor: pointer; transition: transform 0.2s; text-align: center;">
                    <div style="font-size: 40px; margin-bottom: 10px;">🪞</div>
                    <p style="font-size: 14px; line-height: 1.4; margin: 0;">Create your look with your chosen shirt using our<br><b style="color:#facc15; font-size: 16px;">Virtual Try-On!</b></p>
                </button>
                
            </div>
        </div>

        <div id="cameraMessage" style="display: none; color: #4ade80; font-weight: bold; font-size: 22px; text-shadow: 1px 1px 2px black; margin-top: 30px;">
          Initializing... <span id="dots"></span>
        </div>

      </div>

    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
